<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM | Anúncio Fantasma</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --purple: #6366f1;
      --purple-hover: #4f46e5;
      --cyan: #38bdf8;
      --green: #10b981;
      --green-hover: #059669;
      --yellow: #f59e0b;
      --red: #ef4444;
      --red-hover: #dc2626;
      --text-muted: #94a3b8;
      --text-white: #f8fafc;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text-white);
      min-height: 100vh;
      padding: 24px;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-left .logo {
      font-size: 2rem;
    }

    .header-left h1 {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .header-left h1 span {
      color: var(--cyan);
    }

    .header-left .badge {
      background: var(--purple);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-right .stats {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-right .stats span {
      background: var(--card-bg);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .header-right .stats i {
      margin-right: 4px;
    }

    /* ========== FILTROS E BUSCA ========== */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      transition: 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--purple);
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .search-box input {
      background: transparent;
      border: none;
      padding: 10px 10px;
      color: #fff;
      font-size: 0.8rem;
      width: 100%;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--purple);
      color: #fff;
    }

    .filter-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    .filter-btn i {
      margin-right: 4px;
    }

    /* ========== TABELA ========== */
    .table-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      min-width: 700px;
    }

    thead {
      background: rgba(99, 102, 241, 0.08);
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(99, 102, 241, 0.04);
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.7rem;
      color: #fff;
      flex-shrink: 0;
    }

    .domain-cell {
      color: var(--cyan);
      font-weight: 600;
      font-size: 0.8rem;
    }

    .plan-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .plan-free { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }
    .plan-daily { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }
    .plan-weekly { background: rgba(99, 102, 241, 0.15); color: var(--purple); }
    .plan-monthly { background: rgba(16, 185, 129, 0.15); color: var(--green); }

    .status-active {
      color: var(--green);
      font-weight: 700;
    }

    .status-pending {
      color: var(--yellow);
      font-weight: 700;
    }

    .status-expired {
      color: var(--red);
      font-weight: 700;
    }

    .date-cell {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .date-cell .today {
      color: var(--green);
      font-weight: 600;
    }

    .date-cell .old {
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-thin {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.65rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-thin i { font-size: 0.6rem; }

    .btn-approve {
      background: var(--green);
      color: #000;
    }
    .btn-approve:hover { background: var(--green-hover); }

    .btn-danger {
      background: var(--red);
      color: #fff;
    }
    .btn-danger:hover { background: var(--red-hover); }

    .btn-purple {
      background: var(--purple);
      color: #fff;
    }
    .btn-purple:hover { background: var(--purple-hover); }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .empty-state h3 {
      color: #fff;
      margin-bottom: 4px;
    }

    /* ========== RESPONSIVIDADE ========== */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .header-left h1 { font-size: 1rem; }
      .header-right .stats { font-size: 0.65rem; gap: 8px; }
      .header-right .stats span { padding: 2px 8px; }
      .filter-btn { font-size: 0.6rem; padding: 6px 10px; }
      .search-box input { font-size: 0.7rem; padding: 8px 8px; }
      td, th { padding: 10px 12px; font-size: 0.7rem; }
      .user-avatar { width: 26px; height: 26px; font-size: 0.6rem; }
      .btn-thin { font-size: 0.6rem; padding: 4px 8px; }
    }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; justify-content: space-between; }
      .filters { flex-direction: column; }
      .search-box { width: 100%; }
    }

    /* ========== ANIMAÇÃO ========== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    tbody tr {
      animation: fadeIn 0.3s ease forwards;
    }

    tbody tr:nth-child(2) { animation-delay: 0.05s; }
    tbody tr:nth-child(3) { animation-delay: 0.1s; }
    tbody tr:nth-child(4) { animation-delay: 0.15s; }
    tbody tr:nth-child(5) { animation-delay: 0.2s; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div class="header">
    <div class="header-left">
      <span class="logo">👻</span>
      <h1>Anúncio <span>Fantasma</span></h1>
      <span class="badge">ADMIN</span>
    </div>
    <div class="header-right">
      <div class="stats">
        <span id="totalLicenses"><i class="fas fa-hashtag"></i> 0</span>
        <span id="activeCount"><i class="fas fa-check-circle" style="color: var(--green);"></i> 0 ativos</span>
        <span id="pendingCount"><i class="fas fa-clock" style="color: var(--yellow);"></i> 0 pendentes</span>
      </div>
      <button class="btn-thin btn-danger" onclick="deleteAll()">
        <i class="fas fa-trash"></i> EXCLUIR TUDO
      </button>
    </div>
  </div>

  <!-- ========== FILTROS ========== -->
  <div class="filters">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Buscar por domínio, usuário ou plano..." oninput="filterTable()">
    </div>
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)"><i class="fas fa-list"></i> Todos</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active', this)"><i class="fas fa-check-circle" style="color: var(--green);"></i> Ativos</button>
      <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)"><i class="fas fa-clock" style="color: var(--yellow);"></i> Pendentes</button>
      <button class="filter-btn" data-filter="expired" onclick="setFilter('expired', this)"><i class="fas fa-exclamation-circle" style="color: var(--red);"></i> Expirados</button>
      <button class="filter-btn" data-filter="today" onclick="setFilter('today', this)"><i class="fas fa-calendar-day" style="color: var(--cyan);"></i> Hoje</button>
    </div>
  </div>

  <!-- ========== TABELA ========== -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Usuário</th>
          <th>Domínio</th>
          <th>Plano</th>
          <th>Status</th>
          <th>Criado em</th>
          <th>Expira</th>
          <th style="text-align: center;">Ações</th>
        </tr>
      </thead>
      <tbody id="admTable"></tbody>
    </table>
  </div>

<script>
  const firebaseConfig = {
    databaseURL: "https://maestro-server-pro-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allLicenses = [];
  let currentFilter = 'all';
  let searchTerm = '';

  // ========== CARREGAR DADOS ==========
  db.ref('licenses').on('value', snapshot => {
    const data = snapshot.val();
    allLicenses = [];

    if (data) {
      Object.keys(data).forEach(k => {
        allLicenses.push({ id: k, ...data[k] });
      });

      // Ordenar por data (mais recente primeiro)
      allLicenses.sort((a, b) => {
        const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return dateB - dateA;
      });
    }

    updateStats();
    renderTable();
  });

  // ========== UPDATE STATS ==========
  function updateStats() {
    const total = allLicenses.length;
    const active = allLicenses.filter(l => l.active === true).length;
    const pending = allLicenses.filter(l => l.active !== true).length;

    document.getElementById('totalLicenses').innerHTML = `<i class="fas fa-hashtag"></i> ${total}`;
    document.getElementById('activeCount').innerHTML = `<i class="fas fa-check-circle" style="color: var(--green);"></i> ${active} ativos`;
    document.getElementById('pendingCount').innerHTML = `<i class="fas fa-clock" style="color: var(--yellow);"></i> ${pending} pendentes`;
  }

  // ========== RENDER TABELA ==========
  function renderTable() {
    const tbody = document.getElementById('admTable');
    tbody.innerHTML = '';

    let filtered = [...allLicenses];

    // Filtrar por busca
    if (searchTerm.trim()) {
      const term = searchTerm.toLowerCase().trim();
      filtered = filtered.filter(item => {
        return (item.domain && item.domain.toLowerCase().includes(term)) ||
               (item.userName && item.userName.toLowerCase().includes(term)) ||
               (item.planName && item.planName.toLowerCase().includes(term)) ||
               (item.id && item.id.toLowerCase().includes(term));
      });
    }

    // Filtrar por status
    if (currentFilter === 'active') {
      filtered = filtered.filter(item => item.active === true);
    } else if (currentFilter === 'pending') {
      filtered = filtered.filter(item => item.active !== true);
    } else if (currentFilter === 'expired') {
      filtered = filtered.filter(item => {
        if (item.active !== true && item.expiresAt) {
          return new Date(item.expiresAt).getTime() < Date.now();
        }
        return false;
      });
    } else if (currentFilter === 'today') {
      const today = new Date().toDateString();
      filtered = filtered.filter(item => {
        if (item.createdAt) {
          return new Date(item.createdAt).toDateString() === today;
        }
        return false;
      });
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7">
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <h3>Nenhuma licença encontrada</h3>
              <p>${allLicenses.length === 0 ? 'Ainda não há licenças cadastradas.' : 'Tente ajustar os filtros de busca.'}</p>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    filtered.forEach(item => {
      const tr = document.createElement('tr');
      
      // Status
      let statusHtml = '';
      let statusClass = '';
      if (item.active === true) {
        statusHtml = '<span class="status-active"><i class="fas fa-check-circle"></i> ATIVO</span>';
        statusClass = 'status-active';
      } else if (item.expiresAt && new Date(item.expiresAt).getTime() < Date.now()) {
        statusHtml = '<span class="status-expired"><i class="fas fa-exclamation-circle"></i> EXPIRADO</span>';
        statusClass = 'status-expired';
      } else {
        statusHtml = '<span class="status-pending"><i class="fas fa-clock"></i> PENDENTE</span>';
        statusClass = 'status-pending';
      }

      // Plano badge
      let planClass = 'plan-free';
      if (item.planName === 'Diário') planClass = 'plan-daily';
      else if (item.planName === 'Semanal') planClass = 'plan-weekly';
      else if (item.planName === 'Mensal') planClass = 'plan-monthly';

      // Avatar
      const initials = item.userName ? item.userName.substring(0, 2).toUpperCase() : '??';

      // Datas
      const createdAt = item.createdAt ? new Date(item.createdAt) : null;
      const expiresAt = item.expiresAt ? new Date(item.expiresAt) : null;
      const today = new Date();

      let createdHtml = '<span class="date-cell old">--</span>';
      if (createdAt) {
        const isToday = createdAt.toDateString() === today.toDateString();
        createdHtml = `
          <span class="date-cell">
            ${isToday ? '<span class="today"><i class="fas fa-star"></i> HOJE</span>' : ''}
            <span class="${isToday ? 'today' : 'old'}">${createdAt.toLocaleDateString()}</span>
            <br><span style="font-size:0.6rem; color: var(--text-muted);">${createdAt.toLocaleTimeString()}</span>
          </span>
        `;
      }

      let expiresHtml = '<span class="date-cell old">--</span>';
      if (expiresAt) {
        const isExpired = expiresAt.getTime() < today.getTime();
        expiresHtml = `
          <span class="date-cell">
            <span style="color: ${isExpired ? 'var(--red)' : 'var(--green)'};">
              ${isExpired ? '⚠️' : '✅'} ${expiresAt.toLocaleDateString()}
            </span>
            <br><span style="font-size:0.6rem; color: var(--text-muted);">${expiresAt.toLocaleTimeString()}</span>
          </span>
        `;
      }

      tr.innerHTML = `
        <td>
          <div class="user-cell">
            <div class="user-avatar">${initials}</div>
            <span>${item.userName || 'Cliente'}</span>
          </div>
        </td>
        <td class="domain-cell">${item.domain || '--'}</td>
        <td><span class="plan-badge ${planClass}">${item.planName} (${item.price} MT)</span></td>
        <td class="${statusClass}">${statusHtml}</td>
        <td>${createdHtml}</td>
        <td>${expiresHtml}</td>
        <td>
          <div class="actions" style="justify-content: center;">
            ${!item.active ? `<button class="btn-thin btn-approve" onclick="approve('${item.id}', '${item.planName}')"><i class="fas fa-check"></i> APROVAR</button>` : ''}
            <button class="btn-thin btn-danger" onclick="del('${item.id}')"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ========== FILTROS ==========
  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderTable();
  }

  function filterTable() {
    searchTerm = document.getElementById('searchInput').value;
    renderTable();
  }

  // ========== AÇÕES ==========
  function approve(id, planName) {
    let hours = 24;
    if (planName.includes("Semanal")) hours = 168;
    if (planName.includes("Mensal")) hours = 720;

    const expiresAt = new Date(Date.now() + hours * 3600 * 1000).toISOString();
    db.ref('licenses/' + id).update({ active: true, expiresAt: expiresAt })
      .then(() => console.log(`✅ Licença ${id} aprovada`))
      .catch(err => console.error('Erro ao aprovar:', err));
  }

  function del(id) {
    if (confirm("Tem certeza que deseja excluir esta licença?")) {
      db.ref('licenses/' + id).remove()
        .then(() => console.log(`🗑️ Licença ${id} removida`))
        .catch(err => console.error('Erro ao excluir:', err));
    }
  }

  function deleteAll() {
    if (confirm("🚨 ATENÇÃO! Isso vai APAGAR TODAS as licenças. Tem certeza?")) {
      db.ref('licenses').remove()
        .then(() => console.log('🗑️ Todas as licenças removidas'))
        .catch(err => console.error('Erro ao excluir tudo:', err));
    }
  }

  // Atualizar a cada 30 segundos
  setInterval(() => {
    db.ref('licenses').once('value', snapshot => {
      const data = snapshot.val();
      allLicenses = [];
      if (data) {
        Object.keys(data).forEach(k => {
          allLicenses.push({ id: k, ...data[k] });
        });
        allLicenses.sort((a, b) => {
          const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return dateB - dateA;
        });
      }
      updateStats();
      renderTable();
    });
  }, 30000);
</script>
</body>
</html>
