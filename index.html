<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ADM | Anúncio Fantasma</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-solid: #0f172a;
      --border: rgba(255, 255, 255, 0.08);
      --purple: #6366f1;
      --purple-hover: #4f46e5;
      --cyan: #38bdf8;
      --green: #10b981;
      --green-hover: #059669;
      --yellow: #f59e0b;
      --red: #ef4444;
      --red-hover: #dc2626;
      --text-muted: #94a3b8;
      --text-white: #f8fafc;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-white); min-height: 100vh; padding: 24px; overflow-x: hidden; }

    /* ========== ÍCONES SVG BASE ========== */
    .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .icon-sm { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }

    /* ========== HEADER ========== */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header-left .logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .header-left .logo svg { width: 24px; height: 24px; }
    .header-left h1 { font-size: 1.3rem; font-weight: 800; }
    .header-left h1 span { color: var(--cyan); }
    .header-left .badge {
      background: var(--purple); padding: 3px 10px;
      border-radius: 12px; font-size: 0.6rem;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header-right .stats {
      display: flex; gap: 8px; font-size: 0.72rem;
      color: var(--text-muted); flex-wrap: wrap;
    }
    .header-right .stats span {
      background: var(--card-bg); padding: 6px 12px;
      border-radius: 10px; border: 1px solid var(--border);
      display: inline-flex; align-items: center; gap: 6px;
      transition: 0.2s; font-weight: 700;
    }
    .header-right .stats span:hover { border-color: var(--purple); }

    /* ========== AÇÕES EM MASSA ========== */
    .mass-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 20px; padding: 14px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px;
    }
    .mass-btn {
      border: none; padding: 10px 16px; border-radius: 10px;
      font-weight: 700; font-size: 0.72rem; cursor: pointer;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
      flex: 1; justify-content: center; min-width: 140px;
    }
    .mass-btn:active { transform: scale(0.97); }
    .mass-btn svg { width: 16px; height: 16px; }
    .mass-btn-danger { background: var(--red); color: #fff; }
    .mass-btn-danger:hover { background: var(--red-hover); }
    .mass-btn-success { background: var(--green); color: #000; }
    .mass-btn-success:hover { background: var(--green-hover); }
    .mass-btn-warning { background: var(--yellow); color: #000; }
    .mass-btn-warning:hover { background: #d97706; }

    /* ========== FILTROS ========== */
    .filters {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-bottom: 20px; align-items: center;
    }
    .search-box {
      flex: 1; min-width: 200px;
      display: flex; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 0 14px;
      transition: 0.2s;
    }
    .search-box:focus-within { border-color: var(--purple); }
    .search-box svg { color: var(--text-muted); }
    .search-box input {
      background: transparent; border: none; padding: 12px 10px;
      color: #fff; font-size: 0.8rem; width: 100%; outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .filter-buttons {
      display: flex; gap: 8px; flex-wrap: nowrap;
      overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .filter-buttons::-webkit-scrollbar { height: 4px; }
    .filter-buttons::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }
    .filter-btn {
      background: var(--card-bg); border: 1px solid var(--border);
      color: var(--text-muted); padding: 9px 14px;
      border-radius: 10px; font-size: 0.7rem; font-weight: 700;
      cursor: pointer; transition: 0.2s; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .filter-btn:hover { border-color: var(--purple); color: #fff; }
    .filter-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }

    /* ========== TABELA ========== */
    .table-wrapper {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; overflow-x: auto;
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 0.78rem; min-width: 1000px;
    }
    thead { background: rgba(99, 102, 241, 0.08); }
    th {
      padding: 14px 12px; text-align: left;
      font-weight: 700; font-size: 0.68rem;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td {
      padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(99, 102, 241, 0.04); }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: rgba(99, 102, 241, 0.08); }

    .user-cell { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple-hover));
      display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.7rem;
      color: #fff; flex-shrink: 0;
    }
    .domain-cell { color: var(--cyan); font-weight: 600; font-size: 0.8rem; }
    .domain-cell .multi-badge {
      display: inline-block; margin-left: 6px;
      background: rgba(16, 185, 129, 0.15); color: var(--green);
      padding: 1px 6px; border-radius: 8px;
      font-size: 0.55rem; font-weight: 800;
    }

    .plan-badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 12px; font-size: 0.65rem; font-weight: 700;
      white-space: nowrap;
    }
    .plan-free { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }
    .plan-daily { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }
    .plan-weekly { background: rgba(99, 102, 241, 0.15); color: var(--purple); }
    .plan-monthly { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .plan-permanent {
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(56,189,248,0.2));
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.4);
    }

    /* ========== MODO BADGE (NOVO) ========== */
    .mode-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 8px;
      font-size: 0.58rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .mode-badge svg { width: 11px; height: 11px; }
    .mode-single {
      background: rgba(99, 102, 241, 0.15);
      color: var(--purple);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .mode-individual {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-active { color: var(--green); font-weight: 700; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 4px; }
    .status-pending { color: var(--yellow); font-weight: 700; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 4px; }
    .status-expired { color: var(--red); font-weight: 700; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 4px; }
    .status-revoked { color: var(--red); font-weight: 700; font-size: 0.72rem; text-decoration: line-through; display: inline-flex; align-items: center; gap: 4px; }
    .status-renewal {
      color: var(--purple); font-weight: 700; font-size: 0.72rem;
      animation: pulse 1.5s infinite;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .status-active svg, .status-pending svg, .status-expired svg, .status-revoked svg, .status-renewal svg { width: 13px; height: 13px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer-cell {
      font-family: 'Courier New', monospace; font-weight: 700;
      font-size: 0.72rem; padding: 5px 10px; border-radius: 8px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--yellow); text-align: center;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
      min-width: 90px; justify-content: center;
    }
    .timer-cell svg { width: 12px; height: 12px; }
    .timer-cell.danger {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--red); animation: pulse 1.2s infinite;
    }
    .timer-cell.expired {
      background: rgba(107, 114, 128, 0.1);
      border-color: rgba(107, 114, 128, 0.3);
      color: #6b7280;
    }
    .timer-cell.permanent {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--green);
    }

    .date-cell { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
    .date-cell .label { color: var(--text-muted); font-weight: 600; font-size: 0.6rem; }

    .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .btn-thin {
      border: none; padding: 7px 11px; border-radius: 8px;
      font-weight: 700; font-size: 0.62rem; cursor: pointer;
      transition: 0.2s; display: inline-flex; align-items: center;
      gap: 4px; white-space: nowrap;
    }
    .btn-thin svg { width: 12px; height: 12px; }
    .btn-thin:active { transform: scale(0.95); }
    .btn-approve { background: var(--green); color: #000; }
    .btn-approve:hover { background: var(--green-hover); }
    .btn-renew { background: var(--purple); color: #fff; }
    .btn-renew:hover { background: var(--purple-hover); }
    .btn-revoke { background: var(--yellow); color: #000; }
    .btn-revoke:hover { background: #d97706; }
    .btn-reactivate { background: var(--cyan); color: #000; }
    .btn-reactivate:hover { background: #0ea5e9; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: var(--red-hover); }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-state svg { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 12px; }
    .empty-state h3 { color: #fff; margin-bottom: 4px; }

    .notification-badge {
      background: var(--red); color: #fff;
      padding: 1px 6px; border-radius: 10px;
      font-size: 0.55rem; font-weight: 700; animation: pulse 1s infinite;
    }

    /* ========== CARDS MOBILE ========== */
    .mobile-cards { display: none; flex-direction: column; gap: 12px; }
    .mobile-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px;
      animation: fadeIn 0.3s ease;
    }
    .mobile-card-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; margin-bottom: 10px;
      gap: 8px; flex-wrap: wrap;
    }
    .mobile-card-user {
      display: flex; align-items: center; gap: 8px;
      min-width: 0; flex: 1;
    }
    .mobile-card-user .user-avatar { width: 36px; height: 36px; font-size: 0.75rem; }
    .mobile-card-user .user-info { min-width: 0; }
    .mobile-card-user .user-info .name {
      font-weight: 700; font-size: 0.85rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px;
    }
    .mobile-card-user .user-info .domain {
      color: var(--cyan); font-size: 0.7rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 160px;
    }
    .mobile-card-badges {
      display: flex; gap: 6px; flex-wrap: wrap;
      align-items: center;
    }
    .mobile-card-timer {
      margin: 8px 0;
    }
    .mobile-card-timer .timer-cell {
      font-size: 0.75rem; padding: 6px 10px;
      min-width: auto; width: 100%;
    }
    .mobile-card-dates {
      font-size: 0.65rem; color: var(--text-muted);
      margin: 8px 0; padding: 8px;
      background: rgba(3, 7, 18, 0.4); border-radius: 8px;
    }
    .mobile-card-actions {
      display: flex; gap: 6px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .mobile-card-actions .btn-thin {
      flex: 1; justify-content: center;
      padding: 8px 10px; font-size: 0.68rem;
      min-width: 100px;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      display: none; position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 999;
      justify-content: center; align-items: center; padding: 16px;
      backdrop-filter: blur(4px);
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--card-solid); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px;
      max-width: 700px; width: 100%; max-height: 92vh;
      overflow-y: auto; margin: auto;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .modal-header h2 {
      font-size: 1.1rem; font-weight: 800;
      display: flex; align-items: center; gap: 10px;
      min-width: 0; flex: 1;
    }
    .modal-header h2 .avatar-large {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple-hover));
      display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.9rem;
      flex-shrink: 0;
    }
    .modal-header h2 .modal-title-text {
      min-width: 0; overflow: hidden;
    }
    .modal-header h2 .modal-title-text > div:first-child {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-close {
      background: rgba(239, 68, 68, 0.15); color: var(--red);
      border: 1px solid var(--red); width: 36px; height: 36px;
      border-radius: 10px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: 0.2s; flex-shrink: 0;
    }
    .modal-close:hover { background: rgba(239, 68, 68, 0.3); }
    .modal-close svg { width: 16px; height: 16px; }

    .modal-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .stat-box {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; text-align: center;
      transition: 0.2s;
    }
    .stat-box:hover { border-color: rgba(99,102,241,0.3); }
    .stat-box .stat-value {
      font-size: 1.5rem; font-weight: 900;
      color: var(--cyan); line-height: 1;
    }
    .stat-box .stat-label {
      font-size: 0.65rem; color: var(--text-muted);
      font-weight: 700; text-transform: uppercase;
      margin-top: 6px;
    }
    .stat-box.warning .stat-value { color: var(--yellow); }
    .stat-box.danger .stat-value { color: var(--red); }
    .stat-box.success .stat-value { color: var(--green); }

    .limit-alert {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px; padding: 14px 16px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.8rem; color: var(--red); font-weight: 700;
    }
    .limit-alert svg { width: 20px; height: 20px; flex-shrink: 0; }

    .limit-ok {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px; padding: 14px 16px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.8rem; color: var(--green); font-weight: 700;
    }
    .limit-ok svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ========== DOMAIN ITEM (dentro do modal) ========== */
    .domain-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .domain-item {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px;
      transition: 0.2s;
    }
    .domain-item:hover { border-color: rgba(99, 102, 241, 0.4); }
    .domain-item-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
      flex-wrap: wrap; gap: 8px;
    }
    .domain-item-name {
      color: var(--cyan); font-weight: 700;
      font-size: 0.88rem; display: flex;
      align-items: center; gap: 6px;
      word-break: break-all;
    }
    .domain-item-name svg { width: 15px; height: 15px; flex-shrink: 0; }
    .domain-item-badges {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .domain-item-domains-list {
      margin: 8px 0; padding: 10px 12px;
      background: rgba(56, 189, 248, 0.06);
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }
    .domain-item-domains-list .list-title {
      font-size: 0.62rem; color: var(--cyan);
      font-weight: 800; margin-bottom: 6px;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 5px;
    }
    .domain-item-domains-list .list-title svg { width: 12px; height: 12px; }
    .domain-item-domains-list .list-item {
      font-size: 0.72rem; color: var(--text-muted);
      padding: 3px 0; word-break: break-all;
      display: flex; align-items: center; gap: 6px;
    }
    .domain-item-domains-list .list-item::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--cyan); opacity: 0.5;
      flex-shrink: 0;
    }
    .domain-item-meta {
      display: flex; gap: 12px; flex-wrap: wrap;
      font-size: 0.7rem; color: var(--text-muted);
      margin-top: 6px;
    }
    .domain-item-meta span {
      display: inline-flex; align-items: center; gap: 4px;
    }
    .domain-item-meta svg { width: 12px; height: 12px; }
    .domain-item-actions {
      display: flex; gap: 6px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .domain-item-actions .btn-thin {
      flex: 1; justify-content: center;
      padding: 8px 10px; font-size: 0.68rem;
      min-width: 90px;
    }

    /* ========== RESPONSIVIDADE ========== */
    @media (max-width: 900px) {
      .table-wrapper { display: none; }
      .mobile-cards { display: flex; }
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .header-left h1 { font-size: 1rem; }
      .header-left .logo { width: 36px; height: 36px; }
      .header-left .logo svg { width: 20px; height: 20px; }
      .header-right .stats { font-size: 0.65rem; gap: 6px; }
      .header-right .stats span { padding: 5px 9px; }
      .filter-btn { font-size: 0.65rem; padding: 8px 12px; }
      .mass-btn { font-size: 0.68rem; padding: 10px 12px; min-width: 100%; }
      .modal-content { padding: 18px; border-radius: 16px; }
      .modal-stats { grid-template-columns: repeat(2, 1fr); }
      .modal-header h2 { font-size: 0.95rem; }
      .modal-header h2 .avatar-large { width: 38px; height: 38px; font-size: 0.78rem; }
      .domain-item-actions .btn-thin { flex: 1 1 45%; }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .header-right { width: 100%; justify-content: flex-start; }
      .header-right .stats { width: 100%; }
      .header-right .stats span { flex: 1 1 calc(50% - 3px); justify-content: center; }
      .filters { flex-direction: column; }
      .search-box { width: 100%; }
      .mass-actions { flex-direction: column; }
      .modal-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-box { padding: 10px; }
      .stat-box .stat-value { font-size: 1.2rem; }
      .stat-box .stat-label { font-size: 0.58rem; }
      .domain-item-actions .btn-thin { flex: 1 1 100%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    tbody tr, .mobile-card { animation: fadeIn 0.3s ease forwards; }

    /* ========== CONFIRM MODAL ========== */
    .confirm-overlay {
      display: none; position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); z-index: 10000;
      justify-content: center; align-items: center; padding: 16px;
    }

    .confirm-box {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 26px;
      max-width: 420px; width: 100%;
      text-align: center;
      animation: modalIn 0.25s ease;
    }
    .confirm-box .confirm-icon {
      width: 60px; height: 60px;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;

      color: var(--purple);

    .confirm-box h3 { font-size: 1.05rem; margin-bottom: 8px; font-weight: 800; }
    .confirm-box p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; white-space: pre-line; }
    .confirm-box .confirm-actions {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .confirm-box .confirm-actions button {
      flex: 1; min-width: 110px;
      padding: 11px 16px; border-radius: 10px;
      font-weight: 700; font-size: 0.78rem;
      border: none; cursor: pointer; transition: 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .confirm-box .confirm-actions button svg { width: 15px; height: 15px; }
    .confirm-box .confirm-actions .btn-cancel {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }
    .confirm-box .confirm-actions .btn-cancel:hover { background: rgba(148, 163, 184, 0.25); }
    .confirm-box .confirm-actions .btn-confirm {
      background: var(--red); color: #fff;
    }
    .confirm-box .confirm-actions .btn-confirm:hover { background: var(--red-hover); }
    .confirm-box .confirm-actions .btn-confirm.green { background: var(--green); color: #000; }
    .confirm-box .confirm-actions .btn-confirm.green:hover { background: var(--green-hover); }

    /* ========== TOAST ========== */
    .toast-adm {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--green); color: #fff;
      padding: 12px 22px; border-radius: 12px;
      font-weight: 700; font-size: 0.82rem;
      z-index: 10001; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 90vw;
      text-align: center;
      align-items: center; gap: 8px;
    }
    .toast-adm.show { display: flex; animation: fadeInUp 0.3s ease; }
    .toast-adm svg { width: 16px; height: 16px; }
    .toast-adm.error { background: var(--red); }
    .toast-adm.warning { background: var(--yellow); color: #000; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<script>
  const firebaseConfig = {
    databaseURL: "https://maestro-server-pro-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allLicenses = [];
  let currentFilter = 'all';
  let searchTerm = '';
  let timerInterval = null;
  let currentModalUserId = null;

  const PLAN_DURATIONS = {
    'Grátis': 600,
    'Diário': 86400,
    'Semanal': 604800,
    'Mensal': 2592000,
    'Permanente': Infinity
  };

  const MAX_FREE_PLANS_PER_USER = 3;

  // ========== SVG ICONS ==========
  const SVG = {
    check: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    x: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    ban: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
    clock: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    alert: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    sync: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
    redo: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
    trash: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    package: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    wrench: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    eye: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    calendarPlus: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>',
    calendarTimes: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="18"/><line x1="14" y1="14" x2="10" y2="18"/></svg>',
    infinity: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.178 8c5.096 0 5.096 8 0 8-2.317 0-4.146-1.585-5.428-3.6L12 11l-.75 1.4C9.968 14.415 8.139 16 5.822 16c-5.096 0-5.096-8 0-8 2.317 0 4.146 1.585 5.428 3.6L12 13l.75-1.4C14.032 9.585 15.861 8 18.178 8z"/></svg>',
    globe: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    link: '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
  };

  // ========== TOAST ==========
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toastAdm');
    const iconMap = {
      success: SVG.check,
      error: SVG.alert,
      warning: SVG.alert
    };
    toast.innerHTML = (iconMap[type] || SVG.check) + ' ' + message;
    toast.className = 'toast-adm show' + (type === 'error' ? ' error' : type === 'warning' ? ' warning' : '');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ========== CONFIRM MODAL ==========
  let confirmResolver = null;
  function showConfirm(title, message, iconKey = 'warning', confirmText = 'Confirmar', isDanger = true) {
    return new Promise(resolve => {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      const iconEl = document.getElementById('confirmIcon');
      if (iconKey === 'success') {
        iconEl.innerHTML = SVG.check;
        iconEl.style.background = 'rgba(16, 185, 129, 0.15)';
        iconEl.style.color = 'var(--green)';
      } else if (iconKey === 'ban') {
        iconEl.innerHTML = SVG.ban;
        iconEl.style.background = 'rgba(239, 68, 68, 0.15)';
        iconEl.style.color = 'var(--red)';
      } else if (iconKey === 'trash') {
        iconEl.innerHTML = SVG.trash;
        iconEl.style.background = 'rgba(239, 68, 68, 0.15)';
        iconEl.style.color = 'var(--red)';
      } else if (iconKey === 'sync') {
        iconEl.innerHTML = SVG.sync;
        iconEl.style.background = 'rgba(56, 189, 248, 0.15)';
        iconEl.style.color = 'var(--cyan)';
      } else {
        iconEl.innerHTML = SVG.alert;
        iconEl.style.background = 'rgba(99, 102, 241, 0.15)';
        iconEl.style.color = 'var(--purple)';
      }
      const btn = document.getElementById('confirmBtn');
      btn.textContent = confirmText;
      btn.className = 'btn-confirm' + (isDanger ? '' : ' green');
      document.getElementById('confirmOverlay').classList.add('active');
      confirmResolver = resolve;
    });
  }
  function closeConfirm(value) {
    document.getElementById('confirmOverlay').classList.remove('active');
    if (confirmResolver) {
      confirmResolver(value);
      confirmResolver = null;
    }
  }

  // ========== CARREGAR DADOS ==========
  db.ref('licenses').on('value', snapshot => {
    const data = snapshot.val();
    allLicenses = [];

    if (data) {
      Object.keys(data).forEach(k => {
        allLicenses.push({ id: k, ...data[k] });
      });

      allLicenses.sort((a, b) => {
        if (a.renovacaoSolicitada && !b.renovacaoSolicitada) return -1;
        if (!a.renovacaoSolicitada && b.renovacaoSolicitada) return 1;
        const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return dateB - dateA;
      });
    }

    updateStats();
    renderTable();
    renderMobileCards();
    startTimerUpdates();

    if (currentModalUserId) {
      openUserModal(currentModalUserId, true);
    }
  });

  // ========== HELPERS MULTI-DOMÍNIO ==========
  function getDomainsList(lic) {
    if (lic.domains && Array.isArray(lic.domains) && lic.domains.length > 0) {
      return lic.domains;
    }
    if (lic.domain) return [lic.domain];
    return [];
  }

  function getDomainsDisplay(lic) {
    const list = getDomainsList(lic);
    if (list.length === 0) return '--';
    if (list.length === 1) return list[0];
    return list[0] + ` (+${list.length - 1})`;
  }

  // 🔥 MODO DE INSTALAÇÃO
  function getInstallModeBadge(lic) {
    const mode = lic.installMode || (getDomainsList(lic).length > 1 ? 'single' : 'single');
    if (mode === 'individual') {
      return `<span class="mode-badge mode-individual">${SVG.wrench} Individual</span>`;
    }
    return `<span class="mode-badge mode-single">${SVG.package} Único</span>`;
  }

  // ========== TIMER ==========
  function startTimerUpdates() {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
      document.querySelectorAll('.timer-cell[data-license-id]').forEach(el => {
        const licId = el.getAttribute('data-license-id');
        const lic = allLicenses.find(l => l.id === licId);
        
        if (!lic || lic.active !== true) return;
        
        if (lic.planName === 'Permanente') {
          el.className = 'timer-cell permanent';
          el.innerHTML = SVG.infinity + ' NUNCA EXPIRA';
          return;
        }

        const duration = PLAN_DURATIONS[lic.planName];
        if (!duration || duration === Infinity) return;
        
        const startTime = lic.spooferActivatedAt 
          ? new Date(lic.spooferActivatedAt).getTime() 
          : new Date(lic.createdAt).getTime();
        
        const elapsed = (Date.now() - startTime) / 1000;
        const remaining = Math.max(0, duration - elapsed);
        
        if (remaining <= 0) {
          el.className = 'timer-cell expired';
          el.innerHTML = SVG.alert + ' EXPIROU';
          
          db.ref('licenses/' + lic.id).update({
            active: false,
            expiredAt: new Date().toISOString(),
            expiredReason: 'Expiração automática'
          }).catch(err => console.error('Erro:', err));
        } else {
          updateTimerCell(el, lic);
        }
      });
    }, 1000);
  }

  function updateTimerCell(el, lic) {
    if (lic.planName === 'Permanente') {
      el.className = 'timer-cell permanent';
      el.innerHTML = SVG.infinity + ' NUNCA EXPIRA';
      return;
    }

    const duration = PLAN_DURATIONS[lic.planName];
    if (!duration || duration === Infinity) return;

    const startTime = lic.spooferActivatedAt 
      ? new Date(lic.spooferActivatedAt).getTime() 
      : new Date(lic.createdAt).getTime();
    
    const elapsed = (Date.now() - startTime) / 1000;
    const remaining = Math.max(0, duration - elapsed);

    if (remaining <= 0) {
      el.className = 'timer-cell expired';
      el.innerHTML = SVG.alert + ' EXPIROU';
      return;
    }

    el.innerHTML = SVG.clock + ' ' + formatTime(remaining);

    if (remaining < 3600) {
      el.className = 'timer-cell danger';
    } else {
      el.className = 'timer-cell';
    }
  }

  function formatTime(seconds) {
    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);

    if (days > 0) return `${days}d ${hours}h ${mins}m`;
    if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
    return `${mins}m ${secs}s`;
  }

  function isExpired(lic) {
    if (lic.revogadaEm) return false;
    if (lic.planName === 'Permanente') return false;
    if (lic.expiredAt) return true;
    
    if (lic.active !== true) {
      if (lic.expiresAt) return new Date(lic.expiresAt).getTime() < Date.now();
      return false;
    }
    
    const duration = PLAN_DURATIONS[lic.planName];
    if (!duration || duration === Infinity) return false;
    
    const startTime = lic.spooferActivatedAt 
      ? new Date(lic.spooferActivatedAt).getTime() 
      : new Date(lic.createdAt).getTime();
    
    const elapsed = (Date.now() - startTime) / 1000;
    const expired = elapsed >= duration;
    
    if (expired && lic.active === true) {
      db.ref('licenses/' + lic.id).update({
        active: false,
        expiredAt: new Date().toISOString(),
        expiredReason: 'Tempo esgotado'
      }).catch(err => console.error('Erro:', err));
    }
    
    return expired;
  }

  // ========== STATS ==========
  function updateStats() {
    const total = allLicenses.length;
    const active = allLicenses.filter(l => l.active === true && !isExpired(l)).length;
    const pending = allLicenses.filter(l => l.active !== true && !l.renovacaoSolicitada && !l.revogadaEm && !isExpired(l)).length;
    const renewals = allLicenses.filter(l => l.renovacaoSolicitada === true).length;
    const expired = allLicenses.filter(l => isExpired(l)).length;
    const revoked = allLicenses.filter(l => l.revogadaEm).length;

    document.getElementById('totalLicenses').innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg> ${total}`;
    document.getElementById('activeCount').innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--green);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ${active}`;
    document.getElementById('pendingCount').innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--yellow);"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${pending}`;
    document.getElementById('expiredCount').innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--red);"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ${expired}`;
    document.getElementById('revokedCount').innerHTML = `<svg class="icon icon-sm" viewBox="0 0 24 24" style="color: var(--red);"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> ${revoked}`;

    const badge = document.getElementById('renewalBadge');
    if (badge) {
      if (renewals > 0) {
        badge.textContent = renewals;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }
  }

  // ========== DATAS ==========
  function getDatesHtml(lic) {
    const createdAt = lic.createdAt ? new Date(lic.createdAt) : null;
    const expiresAt = lic.expiresAt ? new Date(lic.expiresAt) : null;
    const expiredAt = lic.expiredAt ? new Date(lic.expiredAt) : null;
    const revogadaEm = lic.revogadaEm ? new Date(lic.revogadaEm) : null;
    const agora = new Date();

    let html = '';

    if (createdAt) {
      html += `<div class="date-cell"><span class="label">${SVG.calendarPlus} Criado:</span> ${createdAt.toLocaleDateString('pt-BR')} ${createdAt.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</div>`;
    }

    if (lic.planName === 'Permanente') {
      html += `<div class="date-cell" style="margin-top: 2px;"><span class="label" style="color: var(--green);">${SVG.infinity} Permanente:</span> <span style="color: var(--green);">Nunca expira</span></div>`;
    } else if (expiresAt) {
      const isExp = expiresAt.getTime() < agora.getTime();
      const color = isExp ? 'var(--red)' : 'var(--green)';
      html += `<div class="date-cell" style="margin-top: 2px;"><span class="label">${SVG.clock} Expira:</span> <span style="color: ${color};">${expiresAt.toLocaleDateString('pt-BR')} ${expiresAt.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</span></div>`;
    }

    if (expiredAt) {
      html += `<div class="date-cell" style="margin-top: 2px;"><span class="label" style="color: var(--red);">${SVG.alert} Expirou:</span> <span style="color: var(--red);">${expiredAt.toLocaleDateString('pt-BR')} ${expiredAt.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</span></div>`;
    }

    if (revogadaEm) {
      html += `<div class="date-cell" style="margin-top: 2px;"><span class="label" style="color: var(--red);">${SVG.ban} Revogado:</span> <span style="color: var(--red);">${revogadaEm.toLocaleDateString('pt-BR')} ${revogadaEm.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}</span></div>`;
    }

    if (!html) {
      html = `<div class="date-cell" style="color: var(--yellow);">${SVG.alert} Sem data registrada</div>`;
    }

    return html;
  }

  // ========== RENDER ==========
  function getFiltered() {
    let filtered = [...allLicenses];

    if (searchTerm.trim()) {
      const term = searchTerm.toLowerCase().trim();
      filtered = filtered.filter(item => {
        const domains = getDomainsList(item).join(' ').toLowerCase();
        return (domains.includes(term)) ||
               (item.userName && item.userName.toLowerCase().includes(term)) ||
               (item.planName && item.planName.toLowerCase().includes(term)) ||
               (item.id && item.id.toLowerCase().includes(term));
      });
    }

    if (currentFilter === 'active') {
      filtered = filtered.filter(item => item.active === true && !isExpired(item));
    } else if (currentFilter === 'pending') {
      filtered = filtered.filter(item => item.active !== true && !item.renovacaoSolicitada && !item.revogadaEm && !isExpired(item));
    } else if (currentFilter === 'renewal') {
      filtered = filtered.filter(item => item.renovacaoSolicitada === true);
    } else if (currentFilter === 'expired') {
      filtered = filtered.filter(item => isExpired(item));
    } else if (currentFilter === 'revoked') {
      filtered = filtered.filter(item => item.revogadaEm);
    }

    return filtered;
  }

  function getStatusInfo(item) {
    const isRenewal = item.renovacaoSolicitada === true;
    const isRevoked = !!item.revogadaEm;
    const expired = isExpired(item);

    if (isRenewal) {
      return {
        html: `<span class="status-renewal">${SVG.sync} RENOVAÇÃO</span>`,
        text: 'Renovação',
        color: 'var(--purple)',
        type: 'renewal'
      };
    }
    if (isRevoked) {
      return {
        html: `<span class="status-revoked">${SVG.ban} REVOGADO</span>`,
        text: 'Revogado',
        color: 'var(--red)',
        type: 'revoked'
      };
    }
    if (expired) {
      return {
        html: `<span class="status-expired">${SVG.alert} EXPIRADO</span>`,
        text: 'Expirado',
        color: 'var(--red)',
        type: 'expired'
      };
    }
    if (item.active === true) {
      return {
        html: `<span class="status-active">${SVG.check} ATIVO</span>`,
        text: 'Ativo',
        color: 'var(--green)',
        type: 'active'
      };
    }
    return {
      html: `<span class="status-pending">${SVG.clock} PENDENTE</span>`,
      text: 'Pendente',
      color: 'var(--yellow)',
      type: 'pending'
    };
  }

  function getPlanBadgeClass(planName) {
    if (planName === 'Grátis') return 'plan-free';
    if (planName === 'Diário') return 'plan-daily';
    if (planName === 'Semanal') return 'plan-weekly';
    if (planName === 'Mensal') return 'plan-monthly';
    if (planName === 'Permanente') return 'plan-permanent';
    return 'plan-free';
  }

  function getActionsHtml(item) {
    const status = getStatusInfo(item);
    const isRenewal = status.type === 'renewal';
    const isRevoked = status.type === 'revoked';
    const expired = status.type === 'expired';
    const isActive = status.type === 'active';

    if (isRenewal) {
      return `
        <button class="btn-thin btn-renew" onclick="approveRenewal('${item.id}')">
          ${SVG.check} APROVAR
        </button>
        <button class="btn-thin btn-danger" onclick="rejectRenewal('${item.id}')">
          ${SVG.x}
        </button>
      `;
    }
    if (isRevoked || expired) {
      return `
        <button class="btn-thin btn-reactivate" onclick="reactivate('${item.id}')">
          ${SVG.redo} REATIVAR
        </button>
        <button class="btn-thin btn-danger" onclick="del('${item.id}')">
          ${SVG.trash}
        </button>
      `;
    }
    if (!isActive) {
      return `
        <button class="btn-thin btn-approve" onclick="approve('${item.id}', '${item.planName}')">
          ${SVG.check} APROVAR
        </button>
        <button class="btn-thin btn-danger" onclick="del('${item.id}')">
          ${SVG.trash}
        </button>
      `;
    }
    return `
      <button class="btn-thin btn-revoke" onclick="revoke('${item.id}')">
        ${SVG.ban} REVOGAR
      </button>
      <button class="btn-thin btn-danger" onclick="del('${item.id}')">
        ${SVG.trash}
      </button>
    `;
  }

  function renderTable() {
    const tbody = document.getElementById('admTable');
    tbody.innerHTML = '';

    const filtered = getFiltered();

    if (filtered.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8">
            <div class="empty-state">
              ${SVG.inbox}
              <h3>Nenhuma licença encontrada</h3>
              <p>${allLicenses.length === 0 ? 'Ainda não há licenças cadastradas.' : 'Tente ajustar os filtros.'}</p>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    filtered.forEach(item => {
      const tr = document.createElement('tr');
      tr.className = 'clickable';
      
      const status = getStatusInfo(item);
      const expired = status.type === 'expired';
      const domainsList = getDomainsList(item);
      const domainsDisplay = getDomainsDisplay(item);
      const planClass = getPlanBadgeClass(item.planName);
      const modeBadge = getInstallModeBadge(item);
      const initials = item.userName ? item.userName.substring(0, 2).toUpperCase() : '??';

      tr.onclick = (e) => {
        if (e.target.closest('button') || e.target.closest('a')) return;
        if (item.userId) openUserModal(item.userId);
      };

      let timerHtml = '<span class="timer-cell expired">--</span>';
      if (item.planName === 'Permanente' && item.active === true && !expired) {
        timerHtml = `<span class="timer-cell permanent" data-license-id="${item.id}">${SVG.infinity} NUNCA EXPIRA</span>`;
      } else if (item.active === true && !expired) {
        timerHtml = `<span class="timer-cell" data-license-id="${item.id}">${SVG.clock} ...</span>`;
      } else if (expired) {
        timerHtml = `<span class="timer-cell expired">${SVG.alert} EXPIRADO</span>`;
      }

      const datesHtml = getDatesHtml(item);
      const actionsHtml = getActionsHtml(item);

      tr.innerHTML = `
        <td>
          <div class="user-cell">
            <div class="user-avatar">${initials}</div>
            <div>
              <div>${item.userName || 'Cliente'}</div>
              <div style="font-size: 0.6rem; color: var(--text-muted);">
                ${SVG.eye} ver todos
              </div>
            </div>
          </div>
        </td>
        <td class="domain-cell">
          ${domainsDisplay}
          ${domainsList.length > 1 ? `<span class="multi-badge">${domainsList.length} blogs</span>` : ''}
        </td>
        <td><span class="plan-badge ${planClass}">${item.planName}</span></td>
        <td>${modeBadge}</td>
        <td>${status.html}</td>
        <td>${timerHtml}</td>
        <td>${datesHtml}</td>
        <td>
          <div class="actions">
            ${actionsHtml}
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('.timer-cell[data-license-id]').forEach(el => {
      const licId = el.getAttribute('data-license-id');
      const lic = allLicenses.find(l => l.id === licId);
      if (lic) updateTimerCell(el, lic);
    });
  }

  // ========== RENDER MOBILE CARDS ==========

    container.innerHTML = '';

    const filtered = getFiltered();

      container.innerHTML = `
        <div class="empty-state">
          ${SVG.inbox}
          <h3>Nenhuma licença encontrada</h3>
          <p>${allLicenses.length === 0 ? 'Ainda não há licenças cadastradas.' : 'Tente ajustar os filtros.'}</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const status = getStatusInfo(item);
      const expired = status.type === 'expired';
      const domainsList = getDomainsList(item);
      const domainsDisplay = getDomainsDisplay(item);
      const planClass = getPlanBadgeClass(item.planName);
      const modeBadge = getInstallModeBadge(item);
      const initials = item.userName ? item.userName.substring(0, 2).toUpperCase() : '??';

      const card = document.createElement('div');

      if (item.planName === 'Permanente' && item.active === true && !expired) {
        timerHtml = `<span class="timer-cell permanent" data-license-id="${item.id}">${SVG.infinity} NUNCA EXPIRA</span>`;
      } else if (item.active === true && !expired) {
        timerHtml = `<span class="timer-cell" data-license-id="${item.id}">${SVG.clock} ...</span>`;
      } else if (expired) {
        timerHtml = `<span class="timer-cell expired">${SVG.alert} EXPIRADO</span>`;
      }

      card.innerHTML = `
        <div class="mobile-card-header">
          <div class="mobile-card-user">
            <div class="user-avatar">${initials}</div>
            <div class="user-info">
              <div class="name">${item.userName || 'Cliente'}</div>
              <div class="domain">${SVG.globe} ${domainsDisplay}</div>
            </div>
          </div>
          <div class="mobile-card-badges">
            <span class="plan-badge ${planClass}">${item.planName}</span>
            ${modeBadge}
          </div>
        </div>

        ${domainsList.length > 1 ? `
          <div class="domain-item-domains-list">

            ${domainsList.map(d => `<div class="list-item">${d}</div>`).join('')}
          </div>
        ` : ''}
        <div class="mobile-card-timer">
          ${timerHtml}
        </div>

    document.querySelectorAll('.timer-cell[data-license-id]').forEach(el => {
      const licId = el.getAttribute('data-license-id');
      const lic = allLicenses.find(l => l.id === licId);
      if (lic) updateTimerCell(el, lic);
    });
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderTable();
    renderMobileCards();
  }

  function filterTable() {
    searchTerm = document.getElementById('searchInput').value;
    renderTable();
    renderMobileCards();
  }

  // ========== MODAL DO USUÁRIO ==========
  function openUserModal(userId, keepOpen = false) {
    if (!userId) return;
    currentModalUserId = userId;

    const userLicenses = allLicenses.filter(l => l.userId === userId);

    if (userLicenses.length === 0) {
      showToast('Este usuário não tem licenças cadastradas.', 'warning');
      return;
    }

    const userName = userLicenses[0].userName || 'Cliente';
    const initials = userName.substring(0, 2).toUpperCase();

    document.getElementById('modalAvatar').textContent = initials;
    document.getElementById('modalUserName').textContent = userName;
    document.getElementById('modalUserId').textContent = 'ID: ' + userId.substring(0, 12) + '...';

    const totalDomains = userLicenses.length;
    const activeDomains = userLicenses.filter(l => l.active === true && !isExpired(l)).length;
    const freeUsed = userLicenses.filter(l => l.planName === 'Grátis').length;
    const freeRemaining = Math.max(0, MAX_FREE_PLANS_PER_USER - freeUsed);

    document.getElementById('modalTotalDomains').textContent = totalDomains;
    document.getElementById('modalActiveDomains').textContent = activeDomains;
    document.getElementById('modalFreeUsed').textContent = freeUsed;
    document.getElementById('modalFreeRemaining').textContent = freeRemaining;

    const limitBox = document.getElementById('limitAlertBox');
    if (freeUsed >= MAX_FREE_PLANS_PER_USER) {
      limitBox.innerHTML = `
        <div class="limit-alert">
          ${SVG.alert}
          <div>
            <strong>⚠️ LIMITE DE PLANOS GRÁTIS ATINGIDO!</strong><br>
            <span style="font-size: 0.72rem;">Este usuário já usou ${freeUsed}/${MAX_FREE_PLANS_PER_USER} planos grátis.</span>
          </div>
        </div>
      `;
    } else {
      limitBox.innerHTML = `
        <div class="limit-ok">
          ${SVG.check}
          <div>
            ✅ Este usuário ainda pode usar <strong>${freeRemaining}</strong> plano(s) grátis.
          </div>
        </div>
      `;
    }

    const domainList = document.getElementById('modalDomainList');
    domainList.innerHTML = '';

    userLicenses.forEach(lic => {
      const status = getStatusInfo(lic);
      const domainsList = getDomainsList(lic);
      const planBadgeClass = getPlanBadgeClass(lic.planName);
      const modeBadge = getInstallModeBadge(lic);

      const createdAt = lic.createdAt ? new Date(lic.createdAt) : null;
      const expiresAt = lic.expiresAt ? new Date(lic.expiresAt) : null;
      const expiredAt = lic.expiredAt ? new Date(lic.expiredAt) : null;
      const revogadaEm = lic.revogadaEm ? new Date(lic.revogadaEm) : null;

      let domainsHtml = '';
      if (domainsList.length > 1) {
        domainsHtml = `
          <div class="domain-item-domains-list">
            <div class="list-title">${SVG.link} ${domainsList.length} domínios vinculados (script único)</div>
            ${domainsList.map(d => `<div class="list-item">${d}</div>`).join('')}
          </div>
        `;
      }

      const item = document.createElement('div');
      item.className = 'domain-item';
      item.innerHTML = `
        <div class="domain-item-header">
          <div class="domain-item-name">
            ${SVG.globe} ${domainsList.length === 1 ? domainsList[0] : `${domainsList.length} domínios`}
          </div>
          <div class="domain-item-badges">
            <span class="plan-badge ${planBadgeClass}">${lic.planName}</span>
            ${modeBadge}
            <span style="color: ${status.color}; font-weight: 700; font-size: 0.72rem;">
              ${status.text}
            </span>
          </div>
        </div>
        ${domainsHtml}
        <div class="domain-item-meta">
          ${createdAt ? `<span>${SVG.calendarPlus} Criado: ${createdAt.toLocaleDateString('pt-BR')}</span>` : `<span style="color: var(--yellow);">${SVG.alert} Sem data</span>`}
          ${lic.planName === 'Permanente' ? `<span style="color: var(--green);">${SVG.infinity} Permanente</span>` : ''}
          ${expiresAt && lic.planName !== 'Permanente' ? `<span>${SVG.calendarTimes} Expira: ${expiresAt.toLocaleDateString('pt-BR')}</span>` : ''}
          ${expiredAt ? `<span style="color: var(--red);">${SVG.alert} Expirou: ${expiredAt.toLocaleDateString('pt-BR')}</span>` : ''}
          ${revogadaEm ? `<span style="color: var(--red);">${SVG.ban} Revogado: ${revogadaEm.toLocaleDateString('pt-BR')}</span>` : ''}
        </div>
        <div class="domain-item-actions">
          ${getActionsHtml(lic)}
        </div>
      `;
      domainList.appendChild(item);
    });

    const deleteBtn = document.querySelector('#userModal .mass-btn-danger');
    if (deleteBtn) {
      deleteBtn.setAttribute('onclick', `deleteUserRecords('${userId}')`);
    }

    document.getElementById('userModal').classList.add('active');
  }

  function closeUserModal() {
    document.getElementById('userModal').classList.remove('active');
    currentModalUserId = null;
  }

  document.getElementById('userModal').addEventListener('click', function(e) {
    if (e.target === this) closeUserModal();
  });

  // ========== APROVAR ==========
  function approve(id, planName) {
    const lic = allLicenses.find(l => l.id === id);
    if (!lic) return;

    const isPermanent = planName === 'Permanente';
    const seconds = PLAN_DURATIONS[planName];
    const expiresAt = (!isPermanent && seconds && seconds !== Infinity) 
      ? new Date(Date.now() + seconds * 1000).toISOString() 
      : null;
    
    db.ref('licenses/' + id).update({ 
      active: true, 
      expiresAt: expiresAt,
      spooferActivatedAt: null,
      expiredAt: null,
      revogadaEm: null,
      permanente: isPermanent,
      approvedAt: new Date().toISOString()
    })
    .then(() => showToast(`✅ Licença aprovada! Plano: ${planName}`, 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== APROVAR RENOVAÇÃO ==========
  function approveRenewal(id) {
    const lic = allLicenses.find(l => l.id === id);
    if (!lic) return;

    const isPermanent = lic.planName === 'Permanente';
    const seconds = PLAN_DURATIONS[lic.planName];
    const expiresAt = (!isPermanent && seconds && seconds !== Infinity)
      ? new Date(Date.now() + seconds * 1000).toISOString()
      : null;

    db.ref('licenses/' + id).update({
      active: true,
      expiresAt: expiresAt,
      spooferActivatedAt: null,
      createdAt: new Date().toISOString(),
      renovacaoSolicitada: false,
      renovacaoAprovadaEm: new Date().toISOString(),
      expiredAt: null,
      permanente: isPermanent
    })
    .then(() => showToast(`✅ Renovação aprovada! Plano: ${lic.planName}`, 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  async function rejectRenewal(id) {
    const ok = await showConfirm(
      'Rejeitar renovação?',
      'O usuário será notificado que a renovação foi recusada.',
      'alert',
      'Rejeitar'
    );
    if (!ok) return;

    db.ref('licenses/' + id).update({
      renovacaoSolicitada: false,
      renovacaoRejeitadaEm: new Date().toISOString()
    })
    .then(() => showToast('❌ Renovação rejeitada.', 'warning'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== REVOGAR ==========
  async function revoke(id) {
    const lic = allLicenses.find(l => l.id === id);
    if (!lic) return;

    const domainsList = getDomainsList(lic);
    const domainsText = domainsList.length === 1 
      ? domainsList[0] 
      : `${domainsList.length} domínios`;

    const ok = await showConfirm(
      'Revogar licença?',
      `Revogar a licença de "${domainsText}"?\n\nO usuário perderá o acesso imediatamente.`,
      'ban',
      'Revogar'
    );
    if (!ok) return;

    db.ref('licenses/' + id).update({
      active: false,
      revogadaEm: new Date().toISOString(),
      revogadaMotivo: 'Revogada pelo Administrador'
    })
    .then(() => showToast('✅ Licença REVOGADA!', 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== REATIVAR ==========
  async function reactivate(id) {
    const lic = allLicenses.find(l => l.id === id);
    if (!lic) return;

    const isPermanent = lic.planName === 'Permanente';
    const seconds = PLAN_DURATIONS[lic.planName];
    const expiresAt = (!isPermanent && seconds && seconds !== Infinity)
      ? new Date(Date.now() + seconds * 1000).toISOString()
      : null;
    const agora = new Date().toISOString();

    const domainsList = getDomainsList(lic);
    const domainsText = domainsList.length === 1 
      ? domainsList[0] 
      : `${domainsList.length} domínios`;

    const ok = await showConfirm(
      'Reativar licença?',
      `Reativar a licença de "${domainsText}"?\n\nO tempo será zerado.`,
      'sync',
      'Reativar',
      false
    );
    if (!ok) return;

    db.ref('licenses/' + id).update({
      active: true,
      expiresAt: expiresAt,
      createdAt: agora,
      spooferActivatedAt: null,
      expiredAt: null,
      revogadaEm: null,
      permanente: isPermanent,
      reativadaEm: agora
    })
    .then(() => showToast('✅ Licença REATIVADA!', 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== REVOGAR TODAS ==========
  async function revokeAll() {
    if (allLicenses.length === 0) {
      showToast('Nenhuma licença para revogar.', 'warning');
      return;
    }

    const ok = await showConfirm(
      'Revogar TODAS as licenças?',
      `Isto irá revogar ${allLicenses.length} licenças.\n\nTodos perderão acesso imediatamente.`,
      'ban',
      'Revogar TUDO'
    );
    if (!ok) return;

    const ok2 = await showConfirm(
      'TEM CERTEZA?',
      'Ação irreversível! Todas as licenças serão revogadas agora.',
      'alert',
      'Sim, revogar tudo'
    );
    if (!ok2) return;

    const updates = {};
    const agora = new Date().toISOString();
    
    allLicenses.forEach(lic => {
      updates[`${lic.id}/active`] = false;
      updates[`${lic.id}/revogadaEm`] = agora;
      updates[`${lic.id}/revogadaMotivo`] = 'Revogação em massa';
    });

    db.ref('licenses').update(updates)
    .then(() => showToast(`✅ ${allLicenses.length} licenças REVOGADAS!`, 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== REATIVAR TODAS ==========
  async function reactivateAll() {
    if (allLicenses.length === 0) {
      showToast('Nenhuma licença para reativar.', 'warning');
      return;
    }

    const ok = await showConfirm(
      'Reativar TODAS as licenças?',
      `Isto irá reativar ${allLicenses.length} licenças.\n\nO tempo será ZERADO para todas.`,
      'sync',
      'Reativar TUDO',
      false
    );
    if (!ok) return;

    const updates = {};
    const agora = new Date().toISOString();
    
    allLicenses.forEach(lic => {
      const isPermanent = lic.planName === 'Permanente';
      const seconds = PLAN_DURATIONS[lic.planName];
      const expiresAt = (!isPermanent && seconds && seconds !== Infinity)
        ? new Date(Date.now() + seconds * 1000).toISOString()
        : null;
      
      updates[`${lic.id}/active`] = true;
      updates[`${lic.id}/expiresAt`] = expiresAt;
      updates[`${lic.id}/createdAt`] = agora;
      updates[`${lic.id}/spooferActivatedAt`] = null;
      updates[`${lic.id}/expiredAt`] = null;
      updates[`${lic.id}/revogadaEm`] = null;
      updates[`${lic.id}/permanente`] = isPermanent;
      updates[`${lic.id}/reativadaEm`] = agora;
    });

    db.ref('licenses').update(updates)
    .then(() => showToast(`✅ ${allLicenses.length} licenças REATIVADAS!`, 'success'))
    .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== EXCLUIR ==========
  async function del(id) {
    const lic = allLicenses.find(l => l.id === id);
    if (!lic) return;

    const domainsList = getDomainsList(lic);
    const domainsText = domainsList.length === 1 
      ? domainsList[0] 
      : `${domainsList.length} domínios`;

    const ok = await showConfirm(
      'Apagar registo?',
      `Apagar permanentemente o registo de "${domainsText}"?\n\nEsta ação NÃO pode ser desfeita.`,
      'trash',
      'Apagar'
    );
    if (!ok) return;

    db.ref('licenses/' + id).remove()
      .then(() => {
        showToast('🗑️ Registo apagado com sucesso!', 'success');
        if (currentModalUserId) {
          setTimeout(() => openUserModal(currentModalUserId, true), 300);
        }
      })
      .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== APAGAR REGISTOS DE UM USUÁRIO ==========
  async function deleteUserRecords(userId) {
    const userLicenses = allLicenses.filter(l => l.userId === userId);
    if (userLicenses.length === 0) {
      showToast('Este usuário não tem registos.', 'warning');
      return;
    }

    const ok = await showConfirm(
      'Apagar TODOS os registos deste usuário?',
      `Isto irá apagar permanentemente ${userLicenses.length} registo(s).\n\nAção IRREVERSÍVEL.`,
      'trash',
      'Apagar TUDO'
    );
    if (!ok) return;

    const updates = {};
    userLicenses.forEach(lic => {
      updates[lic.id] = null;
    });

    db.ref('licenses').update(updates)
      .then(() => {
        showToast(`🗑️ ${userLicenses.length} registo(s) apagado(s)!`, 'success');
        closeUserModal();
      })
      .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  // ========== APAGAR TODOS OS REGISTOS (GLOBAL) ==========
  async function deleteAll() {
    if (allLicenses.length === 0) {
      showToast('Não há registos para apagar.', 'warning');
      return;
    }

    const ok = await showConfirm(
      'APAGAR TODOS OS REGISTOS?',
      `Isto irá apagar permanentemente ${allLicenses.length} registo(s) do Firebase.\n\nAção IRREVERSÍVEL!`,
      'trash',
      'APAGAR TUDO'
    );
    if (!ok) return;

    const ok2 = await showConfirm(
      'ÚLTIMA CHANCE!',
      'Tem ABSOLUTA certeza? Todos os registos serão apagados do Firebase e NÃO poderão ser recuperados.',
      'alert',
      'SIM, APAGAR TUDO'
    );
    if (!ok2) return;

    db.ref('licenses').remove()
      .then(() => showToast('🗑️ Todos os registos foram apagados!', 'success'))
      .catch(err => showToast('❌ Erro: ' + err.message, 'error'));
  }

  document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm(false);
  });
</script>
</body>
</html>
